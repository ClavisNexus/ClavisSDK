packages:
  - "packages/*"

overrides:
  tinypool: 2.1.2
  source-map-js: 1.2.2
  esbuild: 0.28.1
  "vite@<7.3.7": ^7.3.7

# 7 days. Install-time block; scripts/audit-min-release-age.mjs is the CI double-check.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# Published by their maintainers without provenance after earlier-published versions had it (pnpm judges by publish date).
trustPolicyExclude:
  - "chokidar@4.0.3"
  - "undici-types@6.21.0"
blockExoticSubdeps: true
