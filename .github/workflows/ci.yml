name: ci

# One job: Actions bills every job by the whole minute, and the three jobs this replaces were each well under one.
# The release age is still checked from the lockfile before anything is downloaded or run.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: github.event_name != 'schedule'
        run: node .github/public-surface.mjs
      # Reads the lockfile only (pnpm ls --lockfile-only), before any dependency is downloaded
      - run: node scripts/audit-min-release-age.mjs
      - run: pnpm run audit:security
      # The daily run only checks the dependencies again
      - if: github.event_name != 'schedule'
        run: pnpm install --frozen-lockfile
      # @clavis.nexus/setup resolves @clavis.nexus/app through its dist
      - if: github.event_name != 'schedule'
        run: pnpm --filter @clavis.nexus/app build
      - if: github.event_name != 'schedule'
        run: pnpm typecheck
      - if: github.event_name != 'schedule'
        run: pnpm test
