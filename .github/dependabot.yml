version: 2
# One pull request per ecosystem and week, so that CI runs once for a week's updates instead of once per
# package. Dependabot does not rebase them: an agent takes the updates into its own pull request.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      # Majors stay one per pull request, since they usually need code changes of their own.
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # tsup writes the .d.ts files through the TypeScript JavaScript API, which TypeScript 7 does not ship
      - dependency-name: typescript
        versions: [">=7"]
      # Node's types stay on the oldest Node the packages support, so newer APIs fail the typecheck
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
